<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}运营商 AI 可视化智能管控平台{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#003da6", "primary-container": "#0052d9", "on-primary": "#ffffff",
        "secondary": "#525f73", "secondary-container": "#d6e3fb",
        "on-secondary-container": "#586579",
        "tertiary": "#004a70", "tertiary-container": "#006394",
        "error": "#ba1a1a", "error-container": "#ffdad6", "on-error-container": "#93000a",
        "surface": "#f8f9fa", "on-background": "#191c1d", "on-surface": "#191c1d",
        "on-surface-variant": "#434654", "surface-variant": "#e1e3e4",
        "surface-container": "#edeeef", "surface-container-low": "#f3f4f5",
        "surface-container-lowest": "#ffffff", "surface-container-high": "#e7e8e9",
        "outline": "#737686", "outline-variant": "#c3c6d7",
        "background": "#f8f9fa"
      }
    }
  }
}
</script>
<style>
body { font-family: 'Inter','Microsoft YaHei',sans-serif; }
.material-symbols-outlined { font-variation-settings:'FILL' 0,'wght'400,'GRAD'0,'opsz'24; vertical-align:middle; }
.card { background:#fff; border:1px solid #e3e6ea; border-radius:14px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.nav-item { transition: all .15s; }
.nav-item.active { background:#eaf1ff; color:#003da6; font-weight:600; }
.nav-item.active .material-symbols-outlined { color:#003da6; }
.pulse-dot { animation:pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.badge-ok { background:#d6e3fb; color:#1d4ed8; }
.badge-warn { background:#fef3c7; color:#b45309; }
.badge-danger { background:#fee2e2; color:#b91c1c; }
</style>
{% block head %}{% endblock %}
</head>
<body class="bg-background text-on-surface min-h-screen">
{% block body %}{% endblock %}
</body>
</html>
